# Firebase App Hosting backend configuration for microflexfilm.com
runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: FIREBASE_PROJECT_ID
    value: mfx-2026
    availability:
      - BUILD
      - RUNTIME

  # Gmail SMTP — Google Workspace account that owns the App Password
  # and appears as the sender on inquiry notifications.
  - variable: SMTP_USER
    value: flex@microflexfilm.com
    availability:
      - RUNTIME

  # Google Workspace App Password for flex@microflexfilm.com (16 chars, no spaces).
  # Set via:  firebase apphosting:secrets:set SMTP_PASSWORD
  - variable: SMTP_PASSWORD
    secret: SMTP_PASSWORD
    availability:
      - RUNTIME

  # Where inquiry emails are sent (comma-separated).
  - variable: INQUIRY_NOTIFY_EMAIL
    value: randy@microflexfilm.com,info@microflexfilm.com
    availability:
      - RUNTIME

  # Display name on the From header.
  - variable: INQUIRY_FROM_NAME
    value: "Microflex Inquiries"
    availability:
      - RUNTIME

  # Tidio live chat public key. Drives the chat widget on every page.
  # Customer chats route into a Google Chat space via Tidio's native integration.
  - variable: NEXT_PUBLIC_TIDIO_PUBLIC_KEY
    value: "vernd2t1mwndbqeg6ebidppeymryyhof"
    availability:
      - BUILD
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Firebase WEB (client) SDK config — PUBLIC identifiers, safe to commit.
  # REQUIRED at BUILD time, or the client portal renders its "coming online"
  # placeholder. Get apiKey + appId from Firebase Console → Project settings →
  # Your apps → SDK setup and configuration (the firebaseConfig object).
  # ---------------------------------------------------------------------------
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyAdfG72UJyKU8E6arutax3_tm29HVvuhUk"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "mfx-2026.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "mfx-2026"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:21746521413:web:40ae99abfe6455bb0a1a2c"
    availability:
      - BUILD
      - RUNTIME

  # Enables portal file uploads. Confirm the exact bucket in Console → Storage
  # (usually mfx-2026.firebasestorage.app or mfx-2026.appspot.com).
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "mfx-2026.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
